<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wordle</title>
    <meta name="description" content="Guess the hidden word in 6 tries. A new puzzle is available each day." />
    <meta name="theme-color" content="#121213" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Wordle" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      (function () {
        var s = {};
        try { s = JSON.parse(localStorage.getItem('wordle:settings') || '{}') || {}; } catch (e) {}
        var dark = typeof s.darkTheme === 'boolean' ? s.darkTheme : !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.contrast = s.highContrast ? 'high' : 'normal';
        // navigator.standalone only exists on iOS, and is true when opened from the home screen.
        if (navigator.standalone === true) document.documentElement.dataset.standalone = 'ios';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
